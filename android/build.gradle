allprojects {
    repositories {
        google()
        mavenCentral()
    }
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.addAll(['-Xlint:-options'])
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    plugins.withId('com.android.library') {
        // CameraX 1.6 references this annotation type during javac compilation.
        if (project.name == 'camera_android_camerax') {
            project.dependencies.add('implementation', 'androidx.concurrent:concurrent-futures:1.2.0')
        }
        if (project.name in ['flutter_zxing', 'jni']) {
            android {
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,--build-id=none'
                        }
                    }
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
ext {
    compileSdkVersion = 37
    targetSdkVersion = 37
    appCompatVersion = "1.4.2"
}
