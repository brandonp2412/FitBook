name: fit_book
description: Track your calories - Completely offline!
publish_to: none
version: 2.0.120+238
environment:
  sdk: ">=3.3.3 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  talker_flutter: ^5.2.0
  cupertino_icons: ^2.0.0
  drift: ^2.35.4
  path_provider: ^2.1.3
  path: ^1.9.0
  provider: ^6.1.2
  dynamic_color: ^1.9.0
  file_picker: ^13.4.1
  image_picker: ^1.2.3
  drafter: ^0.3.0
  intl: ^0.20.2
  csv: ^8.0.0
  sqlite3: ^3.9.2
  share_plus: ^13.2.0
  package_info_plus: ^10.2.0
  url_launcher: ^6.2.6
  badges: ^4.0.1
  openfoodfacts: 3.30.2
  archive: ^4.7.1
  cached_network_image: ^4.0.7
  flutter_zxing: ^3.1.1
  permission_handler: ^13.0.2
  flutter_local_notifications: ^23.0.3
  workmanager: ^0.10.10
  shared_preferences: ^2.5.6
dev_dependencies:
  path_provider_platform_interface: ^2.1.3
  path_provider_windows: ^2.3.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3
  msix: ^3.16.7
  drift_dev: ^2.35.3
  test: ^1.25.8


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/changelogs/
    - assets/changelog_l10n/
flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/ic_launcher.png
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/ic_launcher.png
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: assets/ic_launcher.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/ic_launcher.png
msix_config:
  msstore_appId: 9PJJVF8507G0
  display_name: FitBook - Calorie tracker
  publisher_display_name: Brandon Dick
  identity_name: FrisbeeSoftware.FitBook-Calorietracker
  msix_version: 1.0.155.0
  logo_path: assets/ic_launcher.png
  trim_logo: false
  publisher: CN=BB0811CB-EED5-441C-BE1B-D31F391F76DE
  store: true
