name: Finalize Microsoft Store rollout once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - name: Finalize active published package rollout
        shell: pwsh
        env:
          PRODUCT_ID: ${{ secrets.PRODUCT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $token = Invoke-RestMethod `
            -Method Post `
            -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/token" `
            -ContentType "application/x-www-form-urlencoded" `
            -Body @{
              grant_type = "client_credentials"
              client_id = $env:CLIENT_ID
              client_secret = $env:CLIENT_SECRET
              resource = "https://manage.devcenter.microsoft.com"
            }
          $headers = @{ Authorization = "Bearer $($token.access_token)" }
          $appUrl = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:PRODUCT_ID"
          $app = Invoke-RestMethod -Headers $headers -Uri $appUrl
          $submissionId = $app.lastPublishedApplicationSubmission.id
          if ([string]::IsNullOrWhiteSpace($submissionId)) {
            throw "No last published Microsoft Store submission was found."
          }

          $rolloutUrl = "$appUrl/submissions/$submissionId/packagerollout"
          $rollout = Invoke-RestMethod -Headers $headers -Uri $rolloutUrl
          Write-Host "Published submission $submissionId rollout status=$($rollout.packageRolloutStatus) percentage=$($rollout.packageRolloutPercentage)"

          if ($rollout.packageRolloutStatus -eq "PackageRolloutComplete") {
            Write-Host "Package rollout is already complete."
            exit 0
          }
          if ($rollout.packageRolloutStatus -ne "PackageRolloutInProgress") {
            throw "Expected PackageRolloutInProgress, got $($rollout.packageRolloutStatus)."
          }

          $finalized = Invoke-RestMethod `
            -Method Post `
            -Headers $headers `
            -ContentType "application/json" `
            -Uri "$appUrl/submissions/$submissionId/finalizepackagerollout"
          Write-Host "Finalized rollout status=$($finalized.packageRolloutStatus) percentage=$($finalized.packageRolloutPercentage)"
          if ($finalized.packageRolloutStatus -ne "PackageRolloutComplete") {
            throw "Microsoft Store did not complete the package rollout."
          }
