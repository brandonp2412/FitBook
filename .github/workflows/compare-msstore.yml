name: Compare Microsoft Store submissions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@3b2ec9136230357ce9abc02b9d056626fb248d3f # v1

      - name: Configure Microsoft Store CLI
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET --sellerId $env:MSSTORE_SELLER_ID

      - name: Compare submissions
        shell: pwsh
        env:
          FITBOOK_ID: ${{ secrets.PRODUCT_ID }}
          QUITTER_ID: 9PKVZWDG3FGC
        run: |
          Write-Host "=== FITBOOK ==="
          msstore submission get $env:FITBOOK_ID
          msstore submission status $env:FITBOOK_ID
          Write-Host "=== QUITTER ==="
          msstore submission get $env:QUITTER_ID
          msstore submission status $env:QUITTER_ID
