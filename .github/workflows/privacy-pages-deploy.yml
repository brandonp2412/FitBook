name: Deploy privacy policy Pages

on:
  push:
    branches: [privacy-pages-deploy-fitbook]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Flutter from submodule
        run: |
          git submodule update --init --recursive flutter
          chmod +x flutter/bin/*
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter/bin/flutter pub get --enforce-lockfile

      - name: Enable web support
        run: flutter config --enable-web

      - name: Build Flutter web
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Add privacy policy to web deployment
        run: cp docs/privacy-policy.html build/web/privacy-policy.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
